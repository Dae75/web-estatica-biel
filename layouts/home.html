{{ define "main" }}
<section class="hero">
  <h1>{{ .Params.hero_title }}</h1>
  <p>{{ .Params.hero_text }}</p>
  <a class="btn" href="{{ .Params.hero_link | relURL }}">{{ .Params.hero_button }}</a>
</section>

<section class="cards">
  {{ range .Params.cards }}
  <div class="card">
    <h3>{{ .title }}</h3>
    <p>{{ .text }}</p>
  </div>
  {{ end }}
</section>

<section class="content">
  {{ .Content }}
</section>
{{ end }}
